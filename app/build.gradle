plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.moviai.visualizador3d'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.moviai.visualizador3d"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Sem dependências externas: usa apenas a API do Android e OpenGL ES 3.0.
