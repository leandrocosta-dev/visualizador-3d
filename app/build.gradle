plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.moviai.visualizador3d'
    compileSdk 35

    defaultConfig {
        applicationId "br.com.moviai.visualizador3d"
        minSdk 24
        targetSdk 35
        versionCode 10
        versionName "7.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Realidade aumentada (opcional no aparelho: o app funciona sem ela)
    implementation 'com.google.ar:core:1.44.0'
}
